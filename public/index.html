<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebChat Linux</title><link rel="stylesheet" href="/style.css"></head><body><main class="terminal"><header class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="title">webchat — terminal</div><div id="status">OFFLINE</div></header><section class="screen"><div class="boot">Black Market Business<br><span>Secure visitor channel initialized...</span></div><div id="identity"><label>Name / Nickname</label><div class="row"><input id="name" maxlength="40" placeholder="Pengunjung"><button id="start">CONNECT</button></div><small>ID pengunjung dibuat otomatis.</small></div><div id="chat" class="chat hidden"><div class="chathead"><span id="visitorId">ID: -</span><button id="newChat">NEW ID</button></div><div id="messages" class="messages"></div><form id="form"><b>&gt;</b><input id="text" autocomplete="off" maxlength="2000" placeholder="Ketik pesan..."><button>SEND</button></form></div></section></main><script src="/app.js"></script></body></html>
