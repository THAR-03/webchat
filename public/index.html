<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebChat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="terminal">
    <header>
      <span class="dot"></span>
      <span>WEBCHAT // TERMINAL</span>
      <span id="status">CONNECTING...</span>
    </header>

    <section id="messages" class="messages"></section>

    <form id="form">
      <span class="prompt">&gt;</span>
      <input id="input" autocomplete="off" maxlength="2000"
             placeholder="Ketik pesan..." disabled>
      <button id="send" disabled>KIRIM</button>
    </form>

    <footer id="identity">ID: ...</footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
