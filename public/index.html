<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f0d">
  <title>webchat@linux:~$</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="titlebar">
      <div class="traffic" aria-hidden="true">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      </div>
      <div class="title"><strong>webchat</strong> — terminal session</div>
      <div id="connectionStatus" class="status">connecting</div>
    </header>

    <section class="terminal" id="messages">
      <div class="welcome">
        <div><span class="prompt">guest@webchat</span>:<span class="cmd">~</span>$ ./connect</div>
        <div>Secure chat session initialized.</div>
        <div>Your visitor ID will be shown here after connection.</div>
      </div>
      <div class="messages" id="messageList"></div>
    </section>

    <form class="composer" id="chatForm" autocomplete="off">
      <span class="prompt">guest@webchat:~$</span>
      <input id="messageInput" type="text" maxlength="2000"
             placeholder="ketik pesan..." aria-label="Pesan">
      <button id="sendButton" type="submit">SEND</button>
    </form>
    <div class="footer">webchat • encrypted transport • Linux-inspired UI</div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
