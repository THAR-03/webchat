<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat dengan Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header><div><h1>Chat dengan Admin</h1><p>Kirim pesan kepada owner.</p></div><span id="status">Offline</span></header><section id="nameBox" class="name-box"><label>Nama</label><input id="name" maxlength="40" placeholder="Nama Anda"><button id="start">Mulai Chat</button></section><section id="chatBox" class="chat hidden"><div id="messages" class="messages"></div><form id="form"><input id="message" maxlength="2000" autocomplete="off" placeholder="Tulis pesan..."><button>Kirim</button></form></section></main><script src="/app.js"></script></body></html>
