<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WebChat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="terminal">
    <header>
      <div><span class="dot"></span> WEBCHAT</div>
      <span id="status">Menghubungkan...</span>
    </header>

    <section id="welcome" class="welcome">
      <h1>WebChat</h1>
      <p>Masukkan nama untuk memulai percakapan.</p>
      <div class="join">
        <input id="name" maxlength="40" placeholder="Nama kamu" autocomplete="name">
        <button id="join">Masuk Chat</button>
      </div>
    </section>

    <section id="chat" class="chat hidden">
      <div id="messages" class="messages"></div>
      <form id="form" class="composer">
        <input id="input" maxlength="2000" placeholder="Ketik pesan..." autocomplete="off">
        <button type="submit">Kirim</button>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
